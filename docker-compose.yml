x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: ${TZ:-Europe/Lisbon}
  POSTGRES_USER: ${POSTGRES_USER:-finmanager}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
  POSTGRES_DB: ${POSTGRES_DB:-finmanager}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-replace-with-openssl-rand-hex-32}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  STORAGE_ROOT: /var/lib/finmanager/storage
  BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-owner@finmanager.local}
  BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:-finmanager}
  BOOTSTRAP_HOUSEHOLD_NAME: ${BOOTSTRAP_HOUSEHOLD_NAME:-Casa}
  BRICKSET_API_KEY: ${BRICKSET_API_KEY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-finmanager}
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finmanager} -d ${POSTGRES_DB:-finmanager}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment: *api-env
    volumes:
      - storage-data:/var/lib/finmanager/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/app/docker-entrypoint.sh", "api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment: *api-env
    volumes:
      - storage-data:/var/lib/finmanager/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/app/docker-entrypoint.sh", "worker"]

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Lisbon}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  db-data:
  redis-data:
  storage-data:
